<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b12" />
  <title>FRIDAY — Personal AI</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/attachment-ui.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-orb"></span>
        <div><strong>FRIDAY</strong><span>PERSONAL AI</span></div>
      </div>

      <button id="newChat" class="new-chat"><span>＋</span> New chat</button>

      <div class="recent-heading"><span>RECENT</span></div>
      <div id="recentChats" class="recent-chats"></div>

      <div class="sidebar-footer">
        <div class="connection"><span class="status-dot"></span><div><strong>Online</strong><small>Local core connected</small></div></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <span class="eyebrow">FRIDAY CORE</span>
          <h1>Personal AI assistant</h1>
        </div>
        <button id="testVoice" class="voice-test" type="button"><span>◉</span> Test voice</button>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <div class="composer-wrap">
        <div class="composer-hint"><span id="voiceStatus">Type a message or use your voice</span></div>
        <form id="chatForm" class="composer">
          <textarea id="message" rows="1" autocomplete="off" placeholder="Message Friday…"></textarea>
          <div class="composer-actions">
            <button id="voice" class="icon-button voice-button" type="button" aria-label="Speak to Friday" title="Speak to Friday">🎙</button>
            <button id="send" class="send-button" type="submit" aria-label="Send message" title="Send message">↑</button>
          </div>
        </form>
        <div class="composer-note">Enter to send · Shift+Enter for a new line · Attach an image with ＋ · Voice replies use your custom Friday voice</div>
      </div>
    </main>
  </div>
  <script type="module" src="/app-v2.js"></script>
  <script type="module" src="/attachment-ui.js"></script>
</body>
</html>
